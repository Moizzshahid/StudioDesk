name: Bug report
description: Report a reproducible problem in StudioDesk.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include passwords, API keys, private client data, or other sensitive information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open… 2. Select… 3. See error…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, operating system, and app version
